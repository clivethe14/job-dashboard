<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Job Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #4f8cff;
    --new: #2fbf71;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --border: #e2e5ea;
      --text: #1a1d24;
      --muted: #5c6270;
      --accent: #2f6fed;
      --new: #1a9c56;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { font-size: 20px; margin: 0; }
  .controls { display: flex; gap: 10px; align-items: center; }
  select, button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 14px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  main { padding: 20px 28px; max-width: 1000px; margin: 0 auto; }
  .job-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .job-title { font-size: 15px; font-weight: 600; }
  .job-meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .badge {
    font-size: 11px;
    color: var(--new);
    border: 1px solid var(--new);
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
  }
  .badge.applied {
    color: var(--accent);
    border-color: var(--accent);
  }
  .badge.no-sponsor {
    color: #e5484d;
    border-color: #e5484d;
  }
  .badge.sponsors {
    color: var(--new);
    border-color: var(--new);
  }
  .badge.dismissed {
    color: var(--muted);
    border-color: var(--muted);
  }
  .dismiss-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .dismiss-btn:hover { color: #e5484d; border-color: #e5484d; opacity: 1; }
  .job-card.is-dismissed { opacity: 0.45; }

  .doc-link {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
    padding: 0;
    white-space: nowrap;
  }
  #modalOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #modalOverlay.open { display: flex; }
  #uploadModal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px;
    width: min(440px, 90vw);
  }
  #uploadModal h2 { font-size: 15px; margin: 0 0 4px; }
  #uploadModal .modal-sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  #uploadModal input[type="file"] {
    width: 100%;
    font-size: 13px;
    color: var(--text);
    margin-bottom: 8px;
  }
  #uploadModal .file-list { color: var(--muted); font-size: 12px; margin-bottom: 14px; min-height: 16px; }
  #uploadModal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  #uploadModal .secondary {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
  }
  a.job-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    white-space: nowrap;
  }
  .job-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .applied-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .applied-toggle input { cursor: pointer; }
  .job-card.is-applied {
    opacity: 0.55;
  }
  .job-card.is-applied .job-title {
    text-decoration: line-through;
    text-decoration-color: var(--muted);
  }
  #status { color: var(--muted); font-size: 13px; margin-top: 8px; }
  #empty { color: var(--muted); padding: 40px 0; text-align: center; }

  .layout { display: flex; }
  main { padding: 20px 28px; max-width: 1000px; margin: 0 auto; flex: 1; }

  #debugToggle { position: relative; }
  #debugToggle .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--new);
    margin-right: 6px;
  }
  #debugToggle .dot.has-errors { background: #e5484d; }

  #debugPanel {
    width: 340px;
    flex-shrink: 0;
    border-left: 1px solid var(--border);
    background: var(--panel);
    padding: 20px;
    display: none;
    max-height: 100vh;
    overflow-y: auto;
    position: sticky;
    top: 0;
  }
  #debugPanel.open { display: block; }
  #debugPanel h2 { font-size: 15px; margin: 0 0 12px; }
  #debugPanel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 20px 0 8px; }
  .health-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .health-row .name { display: flex; align-items: center; gap: 8px; }
  .health-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .health-dot.ok { background: var(--new); }
  .health-dot.error { background: #e5484d; }
  .health-time { color: var(--muted); font-size: 11px; }
  .error-item {
    font-size: 12px;
    background: rgba(229, 72, 77, 0.1);
    border: 1px solid rgba(229, 72, 77, 0.3);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 8px;
  }
  .error-item .err-company { font-weight: 600; color: #e5484d; }
  .error-item .err-time { color: var(--muted); font-size: 11px; margin: 2px 0 4px; }
  .error-item .err-msg { color: var(--text); word-break: break-word; }
  .no-errors { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Job Dashboard</h1>
  <div class="controls">
    <select id="companyFilter"><option value="">All companies</option></select>
    <select id="locationFilter">
      <option value="all">All locations</option>
      <option value="usa">USA only</option>
    </select>
    <label class="applied-toggle" style="color: var(--text);">
      <input type="checkbox" id="hideAppliedToggle">
      Hide applied
    </label>
    <label class="applied-toggle" style="color: var(--text);">
      <input type="checkbox" id="hideNonSponsorToggle">
      Hide non-sponsor
    </label>
    <label class="applied-toggle" style="color: var(--text);">
      <input type="checkbox" id="showDismissedToggle">
      Show dismissed
    </label>
    <button id="refreshBtn">Refresh</button>
    <button id="pollBtn">Poll now</button>
    <button id="debugToggle"><span class="dot" id="debugDot"></span>Debug</button>
  </div>
</header>
<div class="layout">
  <main>
    <div id="status"></div>
    <div id="jobList"></div>
    <div id="empty" style="display:none;">No postings yet — click "Poll now" or wait for the next scheduled check.</div>
  </main>
  <aside id="debugPanel">
    <h2>Poll health</h2>
    <div id="healthList"></div>
    <h3>Recent errors</h3>
    <div id="errorList"></div>
  </aside>
</div>
<div id="modalOverlay">
  <div id="uploadModal">
    <h2 id="modalTitle">Upload application documents</h2>
    <div class="modal-sub" id="modalSub"></div>
    <input type="file" id="modalFiles" multiple>
    <div class="file-list" id="modalFileList"></div>
    <div class="modal-actions">
      <button class="secondary" id="modalCancel">Cancel</button>
      <button class="secondary" id="modalSkip">Skip (mark applied only)</button>
      <button id="modalUpload">Upload &amp; mark applied</button>
    </div>
  </div>
</div>
<script>
const jobList = document.getElementById('jobList');
const status = document.getElementById('status');
const empty = document.getElementById('empty');
const companyFilter = document.getElementById('companyFilter');
const locationFilter = document.getElementById('locationFilter');
const hideAppliedToggle = document.getElementById('hideAppliedToggle');
const hideNonSponsorToggle = document.getElementById('hideNonSponsorToggle');
const showDismissedToggle = document.getElementById('showDismissedToggle');

const NON_SPONSOR_FLAGS = ['Does Not Offer Sponsorship', 'U.S. Citizenship is Required'];

function sponsorshipBadge(s) {
  if (!s) return '';
  if (s === 'Offers Sponsorship') return '<span class="badge sponsors">SPONSORS</span>';
  if (s === 'Does Not Offer Sponsorship') return '<span class="badge no-sponsor">NO SPONSORSHIP</span>';
  if (s === 'U.S. Citizenship is Required') return '<span class="badge no-sponsor">US CITIZEN ONLY</span>';
  return '';
}

// --- USA-only filtering (option B: hide only clearly non-US) --------------
// Location strings are freeform and inconsistent across sources, so this is a
// heuristic. A job is HIDDEN in "USA only" mode only when it looks non-US AND
// carries no US signal; anything US or ambiguous ("Remote", "2 Locations",
// bare city) stays visible.
const US_STATE_ABBR = ['al','ak','az','ar','ca','co','ct','de','fl','ga','hi','id','il','in','ia','ks','ky','la','me','md','ma','mi','mn','ms','mo','mt','ne','nv','nh','nj','nm','ny','nc','nd','oh','ok','or','pa','ri','sc','sd','tn','tx','ut','vt','va','wa','wv','wi','wy','dc'];
const US_STATE_NAMES = ['alabama','alaska','arizona','arkansas','california','colorado','connecticut','delaware','florida','georgia','hawaii','idaho','illinois','indiana','iowa','kansas','kentucky','louisiana','maine','maryland','massachusetts','michigan','minnesota','mississippi','missouri','montana','nebraska','nevada','new hampshire','new jersey','new mexico','new york','north carolina','north dakota','ohio','oklahoma','oregon','pennsylvania','rhode island','south carolina','south dakota','tennessee','texas','utah','vermont','virginia','washington','west virginia','wisconsin','wyoming'];
const NON_US_SIGNALS = ['united kingdom','england','scotland','ireland','india','canada','germany','singapore','australia','netherlands','france','spain','poland','japan','israel','brazil','china','sweden','norway','lithuania','south korea','united arab emirates','uae','mexico','portugal','italy','switzerland','denmark','finland','belgium','austria','romania','czech','slovakia','hungary','ukraine','philippines','indonesia','vietnam','thailand','malaysia','taiwan','hong kong','new zealand','argentina','colombia','chile','egypt','nigeria','kenya','south africa','saudi arabia','qatar','turkey','greece','bulgaria','croatia','estonia','latvia','luxembourg','morocco','peru','uruguay','costa rica',
  // major foreign cities that may appear without a country
  'london','dublin','galway','cork','toronto','vancouver','montreal','ottawa','waterloo','bangalore','bengaluru','hyderabad','mumbai','pune','gurgaon','gurugram','chennai','delhi','noida','amsterdam','paris','berlin','munich','madrid','barcelona','warsaw','krakow','tokyo','tel aviv','sao paulo','beijing','shanghai','shenzhen','stockholm','oslo','vilnius','seoul','dubai','abu dhabi','sydney','melbourne','canberra','singapore','zurich','geneva','copenhagen','helsinki','brussels','lisbon','milan','rome','prague','bucharest','budapest','manila','jakarta','bangkok','kuala lumpur','taipei','auckland'];

function wordRe(w) { return new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b'); }

function hasUsSignal(t) {
  if (/\b(usa|u\.s\.a|u\.s|united states)\b/.test(t)) return true;
  if (US_STATE_ABBR.some(s => wordRe(s).test(t))) return true;
  if (US_STATE_NAMES.some(s => t.includes(s))) return true;
  return false;
}
function hasNonUsSignal(t) {
  return NON_US_SIGNALS.some(s => t.includes(s));
}
function isClearlyNonUs(location) {
  const t = (location || '').toLowerCase();
  if (!t) return false;                 // empty -> ambiguous -> keep
  if (hasUsSignal(t)) return false;     // any US signal -> keep
  return hasNonUsSignal(t);             // otherwise hide only if a non-US signal is present
}

function timeAgo(iso) {
  if (!iso) return '';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

async function loadCompanies() {
  const res = await fetch('/api/companies');
  const companies = await res.json();
  for (const c of companies) {
    const opt = document.createElement('option');
    opt.value = c.name;
    opt.textContent = c.name;
    companyFilter.appendChild(opt);
  }
}

async function setApplied(jobId, applied) {
  const res = await fetch('/api/jobs/applied', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: jobId, applied }),
  });
  if (!res.ok) throw new Error('failed to update applied status');
}

async function setDismissed(jobId, dismissed) {
  const res = await fetch('/api/jobs/dismissed', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: jobId, dismissed }),
  });
  if (!res.ok) throw new Error('failed to update dismissed status');
  return res.json();
}

function requestFolder(jobId) {
  // fire-and-forget: creates <base>\Company\Title on disk
  fetch('/api/jobs/folder', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: jobId }),
  }).catch(() => {});
}

async function uploadDocuments(jobId, files) {
  const form = new FormData();
  form.append('id', jobId);
  for (const f of files) form.append('files', f);
  const res = await fetch('/api/jobs/documents', { method: 'POST', body: form });
  if (!res.ok) throw new Error('upload failed');
  return res.json();
}

// ---- Upload modal ----------------------------------------------------------
const modalOverlay = document.getElementById('modalOverlay');
const modalSub = document.getElementById('modalSub');
const modalFiles = document.getElementById('modalFiles');
const modalFileList = document.getElementById('modalFileList');
const modalUpload = document.getElementById('modalUpload');
const modalSkip = document.getElementById('modalSkip');
const modalCancel = document.getElementById('modalCancel');
let modalCtx = null; // { job, mode: 'apply' | 'add' }

function openUploadModal(job, mode) {
  modalCtx = { job, mode };
  modalSub.textContent = `${job.company} — ${job.title}`;
  modalFiles.value = '';
  modalFileList.textContent = '';
  modalSkip.style.display = mode === 'apply' ? '' : 'none';
  modalUpload.textContent = mode === 'apply' ? 'Upload & mark applied' : 'Upload';
  modalOverlay.classList.add('open');
}

function closeUploadModal() {
  modalOverlay.classList.remove('open');
  modalCtx = null;
}

modalFiles.addEventListener('change', () => {
  modalFileList.textContent = [...modalFiles.files].map(f => f.name).join(' · ');
});

modalCancel.addEventListener('click', async () => {
  closeUploadModal();
  await loadJobs(); // reverts the optimistic checkbox
});

modalSkip.addEventListener('click', async () => {
  const { job } = modalCtx;
  closeUploadModal();
  try { await setApplied(job.id, true); } catch (e) { status.textContent = 'Failed to mark applied — try again.'; }
  await loadJobs();
});

modalUpload.addEventListener('click', async () => {
  const { job, mode } = modalCtx;
  if (!modalFiles.files.length) { modalFileList.textContent = 'Choose at least one file (or Skip).'; return; }
  modalUpload.disabled = true;
  let message = null;
  try {
    const result = await uploadDocuments(job.id, modalFiles.files);
    if (mode === 'apply') await setApplied(job.id, true);
    closeUploadModal();
    message = `Saved ${result.saved.length} file(s) to ${result.folder_path}`;
  } catch (e) {
    modalFileList.textContent = 'Upload failed — try again.';
  } finally {
    modalUpload.disabled = false;
  }
  if (message !== null) {
    await loadJobs();
    status.textContent = message;
  }
});

async function loadJobs() {
  status.textContent = 'Loading...';
  const company = companyFilter.value;
  const url = '/api/jobs' + (company ? '?company=' + encodeURIComponent(company) : '');
  const res = await fetch(url);
  let jobs = await res.json();
  let hiddenNonUs = 0;
  if (locationFilter.value === 'usa') {
    jobs = jobs.filter(j => {
      if (isClearlyNonUs(j.location)) { hiddenNonUs++; return false; }
      return true;
    });
  }
  let hiddenApplied = 0;
  if (hideAppliedToggle.checked) {
    jobs = jobs.filter(j => {
      if (j.applied) { hiddenApplied++; return false; }
      return true;
    });
  }
  let hiddenNonSponsor = 0;
  if (hideNonSponsorToggle.checked) {
    jobs = jobs.filter(j => {
      if (NON_SPONSOR_FLAGS.includes(j.sponsorship)) { hiddenNonSponsor++; return false; }
      return true;
    });
  }
  let hiddenDismissed = 0;
  if (!showDismissedToggle.checked) {
    jobs = jobs.filter(j => {
      if (j.dismissed) { hiddenDismissed++; return false; }
      return true;
    });
  }
  jobList.innerHTML = '';
  empty.style.display = jobs.length ? 'none' : 'block';
  for (const j of jobs) {
    const isNew = (Date.now() - new Date(j.first_seen_at).getTime()) < 24 * 3600 * 1000;
    const card = document.createElement('div');
    card.className = 'job-card' + (j.applied ? ' is-applied' : '') + (j.dismissed ? ' is-dismissed' : '');
    card.innerHTML = `
      <div>
        <div class="job-title">${j.title} ${isNew ? '<span class="badge">NEW</span>' : ''} ${j.applied ? '<span class="badge applied">APPLIED</span>' : ''} ${j.dismissed ? '<span class="badge dismissed">NOT A FIT</span>' : ''} ${sponsorshipBadge(j.sponsorship)}</div>
        <div class="job-meta">${j.company} · ${j.location || 'Location N/A'} · seen ${timeAgo(j.first_seen_at)}</div>
      </div>
      <div class="job-actions">
        <a class="job-link" href="${j.url}" target="_blank" rel="noopener">View →</a>
        <label class="applied-toggle">
          <input type="checkbox" class="applied-checkbox" ${j.applied ? 'checked' : ''}>
          Applied
        </label>
        ${j.applied ? '<button class="doc-link add-docs-btn">Add docs</button>' : ''}
        ${j.applied && j.folder_path ? '<button class="doc-link open-folder-btn">📁 Open folder</button>' : ''}
        <button class="dismiss-btn">${j.dismissed ? 'Restore' : 'Not a fit ✕'}</button>
      </div>
    `;
    card.querySelector('.job-link').addEventListener('click', () => requestFolder(j.id));
    const checkbox = card.querySelector('.applied-checkbox');
    checkbox.addEventListener('change', async () => {
      if (checkbox.checked) {
        openUploadModal(j, 'apply');  // Cancel reverts via loadJobs()
        return;
      }
      checkbox.disabled = true;
      try {
        await setApplied(j.id, false);
        await loadJobs();
      } catch (e) {
        checkbox.checked = true;
        checkbox.disabled = false;
        status.textContent = 'Failed to update applied status — try again.';
      }
    });
    const addDocsBtn = card.querySelector('.add-docs-btn');
    if (addDocsBtn) addDocsBtn.addEventListener('click', () => openUploadModal(j, 'add'));
    const openFolderBtn = card.querySelector('.open-folder-btn');
    if (openFolderBtn) openFolderBtn.addEventListener('click', () => {
      fetch('/api/jobs/open-folder', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: j.id }),
      }).catch(() => {});
    });
    const dismissBtn = card.querySelector('.dismiss-btn');
    dismissBtn.addEventListener('click', async () => {
      dismissBtn.disabled = true;
      try {
        const result = await setDismissed(j.id, !j.dismissed);
        await loadJobs();
        if (result.folder_deleted) status.textContent += ' · folder moved to Recycle Bin';
      } catch (e) {
        dismissBtn.disabled = false;
        status.textContent = 'Failed to update — try again.';
      }
    });
    jobList.appendChild(card);
  }
  const parts = [];
  if (hiddenNonUs) parts.push(`${hiddenNonUs} non-US hidden`);
  if (hiddenApplied) parts.push(`${hiddenApplied} applied hidden`);
  if (hiddenNonSponsor) parts.push(`${hiddenNonSponsor} non-sponsor hidden`);
  if (hiddenDismissed) parts.push(`${hiddenDismissed} dismissed hidden`);
  const suffix = parts.length ? ` (${parts.join(', ')})` : '';
  status.textContent = jobs.length + ' postings' + suffix + ' · last refreshed ' + new Date().toLocaleTimeString();
}

document.getElementById('refreshBtn').addEventListener('click', loadJobs);
locationFilter.addEventListener('change', loadJobs);
hideAppliedToggle.addEventListener('change', loadJobs);
hideNonSponsorToggle.addEventListener('change', loadJobs);
showDismissedToggle.addEventListener('change', loadJobs);
document.getElementById('pollBtn').addEventListener('click', async () => {
  status.textContent = 'Polling all companies...';
  const res = await fetch('/api/poll', { method: 'POST' });
  const data = await res.json();
  status.textContent = 'Poll complete: ' + data.new_jobs + ' new job(s) found.';
  await loadJobs();
  await loadDebug();
});
companyFilter.addEventListener('change', loadJobs);

const debugPanel = document.getElementById('debugPanel');
const debugDot = document.getElementById('debugDot');
const healthList = document.getElementById('healthList');
const errorList = document.getElementById('errorList');

document.getElementById('debugToggle').addEventListener('click', () => {
  debugPanel.classList.toggle('open');
});

async function loadDebug() {
  const [healthRes, errorsRes] = await Promise.all([
    fetch('/api/health'),
    fetch('/api/errors?limit=50'),
  ]);
  const health = await healthRes.json();
  const errors = await errorsRes.json();

  debugDot.classList.toggle('has-errors', health.some(h => h.status === 'error'));

  healthList.innerHTML = '';
  for (const h of health) {
    const row = document.createElement('div');
    row.className = 'health-row';
    row.innerHTML = `
      <div class="name">
        <span class="health-dot ${h.status === 'ok' ? 'ok' : 'error'}"></span>
        ${h.company}
      </div>
      <span class="health-time">${timeAgo(h.ran_at)}</span>
    `;
    healthList.appendChild(row);
  }

  errorList.innerHTML = '';
  if (errors.length === 0) {
    errorList.innerHTML = '<div class="no-errors">No errors recorded.</div>';
  } else {
    for (const e of errors) {
      const item = document.createElement('div');
      item.className = 'error-item';
      item.innerHTML = `
        <div class="err-company">${e.company}</div>
        <div class="err-time">${timeAgo(e.ran_at)}</div>
        <div class="err-msg">${e.error || ''}</div>
      `;
      errorList.appendChild(item);
    }
  }
}

loadCompanies();
loadJobs();
loadDebug();
setInterval(loadJobs, 60000);
setInterval(loadDebug, 60000);
</script>
</body>
</html>
